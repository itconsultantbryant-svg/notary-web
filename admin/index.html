<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Hon. Jefferson Teah Notary Public Office</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
</head>
<body>

  <!-- Login -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Admin Dashboard</h1>
      <p>Hon. Jefferson Teah Notary Public Office</p>
      <div id="loginError" class="alert alert-danger hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" id="loginEmail" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" id="loginPassword" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="appLayout" class="app-layout hidden">
    <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <h2>Notary Admin</h2>
        <small>Content &amp; Verification</small>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
        <button class="nav-item" data-section="documents"><i class="fas fa-file-certificate"></i> Documents</button>
        <button class="nav-item" data-section="cms"><i class="fas fa-edit"></i> Content (CMS)</button>
        <button class="nav-item" data-section="contacts"><i class="fas fa-envelope"></i> Submissions</button>
        <button class="nav-item" data-section="settings"><i class="fas fa-cog"></i> Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="userEmail"></div>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="width:100%;color:#fff;border-color:rgba(255,255,255,.3)">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div id="contentArea"></div>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
