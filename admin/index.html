<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Hon. Jefferson Teah Notary Public Office</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
</head>
<body>

  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <!-- Login -->
  <div id="loginScreen" class="login-screen" role="main">
    <div class="login-wrap">
      <div class="login-brand">
        <img src="/assets/img/notary_logo.png" alt="Notary Office logo" class="login-logo" />
        <h1>Admin Dashboard</h1>
        <p>Hon. Jefferson Teah Notary Public Office</p>
      </div>
      <div class="login-card">
        <div id="loginError" class="alert alert-danger hidden" role="alert"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email address</label>
            <input class="form-control" type="email" id="loginEmail" required autocomplete="username" placeholder="admin@jeffersonteahnotarypublic.com" />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input class="form-control" type="password" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign In
          </button>
        </form>
        <p class="login-footer">
          <a href="/" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> View public website</a>
        </p>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="appLayout" class="app-layout hidden">
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <button class="mobile-toggle" id="mobileToggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <div class="sidebar-brand">
        <img src="/assets/img/notary_logo.png" alt="" class="sidebar-logo" aria-hidden="true" />
        <div>
          <h2>Notary Admin</h2>
          <small>Content &amp; Verification</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" type="button" data-section="dashboard"><i class="fas fa-tachometer-alt" aria-hidden="true"></i> Dashboard</button>
        <button class="nav-item" type="button" data-section="analytics"><i class="fas fa-chart-line" aria-hidden="true"></i> Analytics</button>
        <button class="nav-item" type="button" data-section="documents"><i class="fas fa-file-certificate" aria-hidden="true"></i> Documents</button>
        <button class="nav-item" type="button" data-section="cms"><i class="fas fa-edit" aria-hidden="true"></i> Content (CMS)</button>
        <button class="nav-item" type="button" data-section="contacts"><i class="fas fa-envelope" aria-hidden="true"></i> Submissions</button>
        <button class="nav-item" type="button" data-section="settings"><i class="fas fa-cog" aria-hidden="true"></i> Settings</button>
      </nav>
      <div class="sidebar-stats" id="sidebarStats" aria-label="Today's activity">
        <div class="sidebar-stats-title">Today</div>
        <div class="sidebar-stat-row"><span>Visitors</span><strong id="sbVisitors">—</strong></div>
        <div class="sidebar-stat-row"><span>Page views</span><strong id="sbViews">—</strong></div>
        <div class="sidebar-stat-row"><span>Verifications</span><strong id="sbVerifications">—</strong></div>
      </div>
      <div class="sidebar-footer">
        <div class="user-info" id="userEmail"></div>
        <button class="btn btn-sidebar-logout btn-sm" type="button" id="logoutBtn">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout
        </button>
        <a href="/" class="sidebar-site-link" target="_blank" rel="noopener"><i class="fas fa-globe"></i> View website</a>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="page-header">
        <div>
          <p class="page-eyebrow">Administration</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
      </div>
      <div id="contentArea" aria-live="polite"></div>
    </main>
  </div>

  <div id="globalLoader" class="global-loader hidden" aria-hidden="true">
    <div class="loader-spinner"></div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
